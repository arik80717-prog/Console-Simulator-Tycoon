<style>
:root{--ink:#fff3da;--paper:#14121f;--panel:#fff;--line:#14121f;--mute:#6b6477;--signal:#ff4d8d;--glow:#2f6bff;--good:#0a9d63;--bad:#e5322d;--sun:#ffd23f;
--display:'Arial Narrow','Roboto Condensed','Helvetica Neue',system-ui,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#1a1530;--paper:#fff3da;--panel:#2a2250;--line:#fff3da;--mute:#b4a9d6;--signal:#ff6fa5;--glow:#6f98ff;--good:#4fe0a0;--bad:#ff6b66}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--ink);background-image:radial-gradient(var(--mute) 1px,transparent 1.5px);background-size:24px 24px;color:var(--paper);font:15px/1.45 var(--body);padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sun);z-index:10}
.wrap{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sun);color:#14121f;border:3px solid var(--line);border-top:0;border-radius:0 0 18px 18px;box-shadow:0 5px 0 var(--line);padding:12px 14px}
.top .lab{color:#14121f;opacity:.7}
.top .btn{background:#fff;color:#14121f;border-color:#14121f;box-shadow:0 3px 0 #14121f}
.top .btn.on{background:#14121f;color:var(--sun)}
.row{display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.lab{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cash{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums;color:#14121f}.cash.neg{color:var(--bad)}
.num{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;color:#14121f}
.ctl{display:flex;gap:8px;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;font:600 13px var(--mono);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.on{background:var(--paper);color:var(--ink)}
.btn.go{background:var(--signal);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.grow{flex:1}
h2{display:inline-block;font:700 21px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:26px 0 12px;background:var(--glow);color:#fff;padding:6px 11px;border:2px solid var(--line);border-radius:8px;box-shadow:3px 3px 0 var(--line)}
.card{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:4px 4px 0 var(--line)}
.card h3{margin:0 0 6px;font:700 19px/1.15 var(--display);letter-spacing:.02em}
.tag{display:inline-block;font:600 10px var(--mono);letter-spacing:.05em;border:2px solid var(--line);background:var(--sun);color:#14121f;padding:0 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.tag.new{background:var(--signal);color:#fff}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px;margin-top:8px}
.kv div{min-width:0}
.kv b{display:block;font:600 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:2px dotted var(--mute)}
.step:first-of-type{border-top:0}
.step .nm{min-width:0}
.step small{display:block;color:var(--mute);font-size:12px}
.ctr{display:flex;align-items:center;gap:8px}
.ctr .btn{min-width:40px;padding:8px 0;text-align:center}
.ctr span{min-width:44px;text-align:center;font:600 16px var(--mono)}
.bar{height:12px;background:var(--ink);border:2px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--signal) 0 8px,#ff86b0 8px 16px);transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;margin-top:8px}
.opt.on{background:var(--sun);color:#14121f}.opt.on .o2{color:#14121f}
.opt:disabled{opacity:.45;cursor:not-allowed}
.o1{min-width:0;font-weight:600}
.o2{font:600 12px var(--mono);color:var(--mute);text-align:right;flex:none}
.log{list-style:none;margin:0;padding:0}
.log li{padding:7px 0;border-top:2px dotted var(--mute);font-size:14px}
.log time{font:600 11px var(--mono);color:var(--mute);margin-right:8px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sun);border-top:3px solid var(--line);display:flex;padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.nav .in{display:flex;width:100%;max-width:560px;margin:0 auto;gap:6px;padding:8px 0}
.tab{flex:1;background:none;border:2px solid transparent;border-radius:10px;padding:9px 2px;font:700 13px var(--display);letter-spacing:.03em;text-transform:uppercase;color:#14121f}
.tab.on{background:#14121f;color:var(--sun)}
.over{position:fixed;inset:0;z-index:20;background-color:var(--ink);background-image:radial-gradient(var(--mute) 1px,transparent 1.5px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.over h1{font:700 48px/1 var(--display);text-transform:uppercase;margin:0 0 12px;color:var(--signal);text-shadow:3px 3px 0 var(--line)}
.note{font-size:13px;color:var(--mute);margin:4px 0 0}
.mm{display:flex;flex-direction:column;gap:12px;margin:22px auto 0;max-width:300px}.mm .btn{min-height:52px;font-size:15px}
.mm .btn small{display:block;color:var(--mute);font-size:11px;margin-top:2px}.mm .btn.go small{color:#fff}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ach div{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;background:var(--panel)}.ach .ok{background:var(--sun);color:#14121f}
*{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}.step,.tab,.btn{-webkit-user-select:none;user-select:none}
textarea{width:100%;height:130px;font:500 11px var(--mono);padding:9px;border:2px solid var(--line);border-radius:10px;background:var(--ink);color:var(--paper);margin-top:10px}
input{flex:1;min-width:0;font:500 14px var(--mono);padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--ink);color:var(--paper);min-height:42px}
</style>

</head>

<script>
const START=1985, GOAL=3000000;
const MON=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const CN=['Nintando','Sego','Sonix','Atary','Xbocks','Playstashun','Neo-Geo','Famikom'];
const GA=['Супер','Мега','Ультра','Нео','Турбо','Легендарный','Тёмный','Классический'];
const GN=['Марьо','Соник Рашш','Зелдо','Мортал Файт','Пэкмен','Тетрикс','Файнал Фэнтэзи','Кроссфайр'];
/* w = вес для [процессор, видеочип, память, контроллер] */
const GENRES=[
  {n:'Экшен',w:[1,3,1,3]},{n:'РПГ',w:[1,1,3,1]},{n:'Гонки',w:[2,3,1,3]},{n:'Головоломка',w:[1,0,1,1]},{n:'Спорт',w:[2,2,2,2]}];
const SCOPES=[
  {n:'Малая',cost:9000,mo:2,b:0,mm:.5},{n:'Средняя',cost:28000,mo:4,b:6,mm:1.5},{n:'Большая',cost:85000,mo:7,b:14,mm:3}];
const MK=[{n:'Без рекламы',cost:0,m:1},{n:'Обычная',cost:8000,m:1.15},{n:'Большая',cost:25000,m:1.4}];
/* y = год появления, uc = себестоимость в консоли, rd = цена разработки */
const CAT=[
 {k:'cpu',n:'Процессор',items:[
  {n:'ZX-8 · 8 бит',y:1985,uc:10,rd:5000},{n:'ZX-16 · 16 бит',y:1988,uc:18,rd:9000},{n:'RISC-32 · 32 бита',y:1992,uc:30,rd:16000},
  {n:'Vortex-64 · 64 бита',y:1996,uc:48,rd:28000},{n:'Quad · 4 ядра',y:2000,uc:75,rd:45000},{n:'Hexa · 6 ядер',y:2004,uc:110,rd:70000},{n:'Octa · 8 ядер',y:2009,uc:150,rd:100000}]},
 {k:'gpu',n:'Видеочип',items:[
  {n:'Тайловый чип',y:1985,uc:10,rd:5000},{n:'Спрайтовый 16 бит',y:1989,uc:20,rd:10000},{n:'3D-ускоритель',y:1993,uc:34,rd:18000},
  {n:'Шейдерный GPU',y:1997,uc:55,rd:30000},{n:'HD-графика',y:2001,uc:85,rd:48000},{n:'Унифицированный GPU',y:2005,uc:120,rd:72000},{n:'Трассировка лучей',y:2010,uc:170,rd:105000}]},
 {k:'ram',n:'Оперативная память',items:[
  {n:'8 КБ',y:1985,uc:6,rd:3000},{n:'64 КБ',y:1988,uc:12,rd:6000},{n:'2 МБ',y:1991,uc:22,rd:11000},
  {n:'16 МБ',y:1995,uc:36,rd:19000},{n:'128 МБ',y:1999,uc:55,rd:30000},{n:'512 МБ',y:2003,uc:80,rd:48000},{n:'4 ГБ',y:2008,uc:115,rd:75000}]},
 {k:'media',n:'Носитель игр',items:[
  {n:'Картридж ROM',y:1985,uc:4,rd:3000},{n:'Картридж с батарейкой',y:1987,uc:10,rd:6000},{n:'CD-ROM',y:1993,uc:18,rd:10000},
  {n:'DVD-диск',y:1997,uc:26,rd:16000},{n:'Флеш-карта',y:2001,uc:34,rd:24000},{n:'Blu-ray',y:2005,uc:48,rd:36000},{n:'SSD-модуль',y:2011,uc:70,rd:60000}]},
 {k:'ctl',n:'Контроллер',items:[
  {n:'Джойстик',y:1985,uc:3,rd:2000},{n:'Крестовина, 2 кнопки',y:1985,uc:6,rd:4000},{n:'Геймпад, 6 кнопок',y:1989,uc:10,rd:7000},
  {n:'Геймпад с плечевыми',y:1993,uc:15,rd:11000},{n:'Аналог и вибро',y:1997,uc:22,rd:16000},{n:'Датчики движения',y:2005,uc:32,rd:26000},{n:'Сенсорный экран',y:2010,uc:45,rd:40000}]},
 {k:'des',n:'Корпус',items:[
  {n:'Строгий',y:1985,uc:5,rd:2000,ap:0},{n:'Стильный',y:1985,uc:14,rd:6000,ap:.1},{n:'Премиум',y:1985,uc:30,rd:14000,ap:.22},{n:'Алюминий',y:1995,uc:45,rd:22000,ap:.32},{n:'Лимитированный',y:2005,uc:70,rd:40000,ap:.45}]},
 {k:'snd',n:'Звук',items:[
  {n:'Пищалка',y:1985,uc:2,rd:1000},{n:'Синтезатор, 4 канала',y:1988,uc:6,rd:4000},{n:'Стерео PCM',y:1993,uc:12,rd:9000},
  {n:'Объёмный звук',y:2000,uc:22,rd:20000},{n:'Dolby Surround',y:2007,uc:35,rd:38000}]}
];
const T=['Квантовый','Нейронный','Фотонный','Плазменный','Орбитальный','Гравитонный','Тахионный','Мультиверсный'];
const REN={cpu:['Zylog Z81 · 8 бит','Motorolo 68000 · 16 бит','Intelo 486 · 32 бита','MIPZ R4400 · 64 бита','Athlonn XP · 1 ГГц','Core Duo T2300','Ryzor 7 · 8 ядер'],
gpu:['Atary TIA','Yamaho V9938','3dFX Voodoo','NVidya TNT2','RadeOn 8500 HD','GeForz 8800 GTX','GeForz RTX 2080'],
media:['Картридж ROM','Картридж Save-Batt','CD-ROM Mega','DVD-9','SD-карта Pro','Blu-Ray BD-50','SSD NVMe M.2'],
ctl:['Джойстик Atary 2600','Крестовина Famikom','Геймпад Mega Drive 6B','Геймпад SuperPad SNS','Аналог N65 Rumble','Wimote Motion','Switchy Touch'],
des:['Корпус Classic Grey','Корпус Retro Wood','Корпус Premium Black','Корпус Alu-Silver','Корпус Limited Gold'],
snd:['Beeper PSG','Yamaho YM2612','Stereo Sound Blaster','Dolbi Digital 5.1','DTS HD-Master']};
Object.entries(REN).forEach(([k,a])=>{const it=CAT.find(c=>c.k===k).items;a.forEach((n,i)=>{if(it[i])it[i].n=n})});
const NG={cpu:i=>`${['Intelo','Ryzor'][i%2]} ${['Pentix','Core i','Zeon','Aero'][i%4]} ${i+5}-${1000+i*350}`,
gpu:i=>`${['NVidya GeForz','RadeOn RX','Arcx'][i%3]} ${(i+30)*100}`,
ram:i=>{const v=8*Math.pow(2,i),u=['ГБ','ТБ','ПБ','ЭБ','ЗБ','ИБ'],e=Math.min(5,Math.floor(Math.log(v)/Math.log(1024)));return `Память ${Math.round(v/Math.pow(1024,e))} ${u[e]} DDR${5+Math.floor(i/2)}`},
media:i=>`${['SSD NVMe','Кристалл Crystal','Голодиск HVD','Стрим-ключ'][i%4]} ${(i+2)*2} ТБ`,
ctl:i=>`Геймпад ${['DualShok','Xboxer','ProCon','Switchy'][i%4]} ${i+5}`,
des:i=>`Корпус ${['Slim','Carbon','Titan','Aero','Neon'][i%5]} ${i+3}`,
snd:i=>`${['Dolbi Atmoz','DTS:X Pro','Sonic 3D'][i%3]} ${i+7}.${i%3+1}`};
/* до 2200 года новое поколение каждой детали раз в 9 лет */
[['cpu',2013,'Ядро',170,110000],['gpu',2014,'Видеоядро',190,120000],['ram',2013,'Память',125,85000],['media',2014,'Носитель',80,70000],['ctl',2014,'Контроллер',50,50000],['des',2014,'Корпус',80,45000],['snd',2016,'Аудио',40,45000]].forEach(([k,y0,w,uc,rd])=>{
  const it=CAT.find(c=>c.k===k).items;
  for(let i=0;i<21;i++){const o={n:NG[k](i),y:y0+i*9,uc:Math.round(uc*Math.pow(1.045,i)),rd:Math.round(rd*Math.pow(1.06,i))};if(k==='des')o.ap=Math.min(1,.5+i*.03);it.push(o)}
});
const DIFF=[{n:'Лёгкая',cash:150000,exp:.8,sale:1.2},{n:'Обычная',cash:100000,exp:1,sale:1},{n:'Сложная',cash:60000,exp:1.3,sale:.85},{n:'Песочница',cash:500000,exp:.5,sale:1.2}];
const KEY='garage-console-v2';
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const money=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ru-RU')+' $';
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const label=m=>MON[m%12]+' '+(START+Math.floor(m/12));
const yr=()=>START+Math.floor(S.m/12);
const itm=(k,i)=>CAT.find(c=>c.k===k).items[i];
const sumF=(d,f)=>CAT.reduce((s,c)=>s+itm(c.k,d[c.k])[f],0);
const rdCost=d=>Math.round((10000+sumF(d,'rd'))*(1-.05*S.up.lab));
const unitCost=d=>15+sumF(d,'uc');
const power=d=>d.cpu+d.gpu+d.ram+3;
const appeal=d=>Math.min(2.2,1+d.ctl*.06+d.media*.05+itm('des',d.des).ap+d.snd*.03);
const mktPrice=d=>70+power(d)*28+(d.ctl+d.media)*8+d.snd*5+itm('des',d.des).ap*100;
const rdMonths=d=>Math.min(18,3+Math.floor((d.cpu+d.gpu+d.ram+d.media+d.ctl+d.des+d.snd)/3));
const expected=()=>3.5+S.m/30;
const newCName=()=>pick(CN)+' '+Math.floor(rnd(2,99));
const newGName=()=>pick(GA)+' '+pick(GN);
const $=s=>document.querySelector(s);

let S, timer, menu=true, cn=false;
function fresh(df=1){
  const cd={cpu:0,gpu:0,ram:0,media:0,ctl:0,des:0,snd:0,price:150,name:newCName()};
  return {m:0,cash:DIFF[df].cash,diff:df,offers:[],cprj:[],tp:{n:0,rev:0},br:20,res:{},awards:[],loan:0,up:{mk:0,fab:0,qa:0,lab:0},ach:{},hist:[],camp:{},hot:{g:0,left:12},fans:0,devs:1,cons:[],games:[],proj:[],rd:null,id:1,tab:'c',speed:0,over:false,won:false,net:0,
    log:[{m:0,t:'Гараж арендован. Пора делать первую консоль.'}],
    cd,gd:{genre:0,scope:0,con:null,mk:0,name:newGName()}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.cd&&o.cd.ram!==undefined&&o.gd){o.cd.snd??=0;o.cons.forEach(c=>{c.snd??=0});o.speed=0;o.diff??=1;o.offers??=[];o.cprj??=[];o.tp??={n:0,rev:0};o.loan??=0;o.br??=20;o.awards??=[];if(!o.res){o.res={};CAT.forEach(k=>k.items.forEach((it,i)=>{if(it.y<=START+Math.floor(o.m/12))o.res[k.k+i]=1}))}o.up??={mk:0,fab:0,qa:0,lab:0};o.ach??={};o.hist??=[];o.camp??={};o.hot??={g:0,left:12};return o}}}catch(e){}return fresh()}
function hasSave(){try{const o=JSON.parse(localStorage.getItem(KEY));return !!(o&&o.cd&&!o.over)}catch(e){return false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function say(t){S.log.unshift({m:S.m,t});S.log.length=Math.min(S.log.length,40)}

function release(p){
  const c=S.cons.find(x=>x.id===p.con);
  const g={id:S.id++,name:p.name,genre:p.genre,con:p.con,q:p.q,mk:p.mk,rel:S.m,units:0,rev:0,last:0};
  S.games.push(g);
  S.br+=Math.round(p.q/8);const dF=Math.round((p.q-50)*8*p.mk); S.fans=Math.max(0,S.fans+dF);
  say('Вышла «'+g.name+'» для '+c.name+'. Оценка прессы: '+(p.q/10).toFixed(1)+'. Фанатов '+(dF>0?'+':'')+fmt(dF)+'.');
}
function tick(){
  if(S.over)return;
  S.m++;
  let inc=0, exp=(S.devs*4500+2000)*DIFF[S.diff].exp;
  if(S.rd){
    S.rd.left--;
    if(S.rd.left<=0){
      const d=S.rd, c={id:S.id++,name:d.name,launch:S.m,sold:0,last:0,price:d.price};
      CAT.forEach(k=>{c[k.k]=d[k.k]});
      c.power=power(d); c.cost=unitCost(d); c.ap=appeal(d); c.mp=mktPrice(d); c.roy=18+(d.media+1)*4;
      S.cons.push(c);
      say('Консоль «'+d.name+'» поступила в продажу.');
      S.rd=null; S.cd.name=newCName();
    }
  }
  S.proj=S.proj.filter(p=>{p.left--;if(p.left>0)return true;release(p);return false});
  S.offers=S.offers.filter(o=>--o.exp>0);
  S.cprj=S.cprj.filter(p=>{p.left--;if(p.left>0)return true;releaseEx(p);return false});
  S.games=S.games.filter(g=>!g.third||S.m-g.rel<36);
  S.cons.forEach(c=>{if(!c.off&&Math.random()<Math.min(.7,.04+c.sold/150000)){S.games.push({id:S.id++,name:newGName(),genre:Math.floor(rnd(0,5)),con:c.id,q:clampQ(rnd(38,82)+(S.fans>5000?4:0)),mk:.6,rel:S.m,units:0,rev:0,last:0,third:true});S.tp.n++}});
  if(S.cons.length&&S.offers.length<3&&Math.random()<.22)newOffer();
  S.cons.forEach(c=>{

  if(r===2){say('Брак в партии консолей. Расходы на гарантию: '+money(8000)+'.');return -8000}
  const l=Math.round(S.fans*.05);S.fans-=l;say('Конкурент выпустил громкий хит. Фанатов −'+fmt(l)+'.');return 0
}
function setSpeed(n){S.speed=n;clearInterval(timer);if(n)timer=setInterval(tick,n===1?1200:n===3?80:450)}

function act(a,v){
  if(a==='tab')S.tab=v;
  else if(a==='speed')setSpeed(+v);
  else if(a==='next')tick();
  else if(a==='part'){const[k,i]=v.split(':');if(itm(k,+i).y<=yr()&&isRes(k,+i))S.cd[k]=+i}
  else if(a==='price'){S.cd.price=Math.max(50,S.cd.price+ +v)}
  else if(a==='mkt')S.cd.price=Math.round(mktPrice(S.cd)/10)*10;
  else if(a==='cname')S.cd.name=newCName();
  else if(a==='rd'){const c=rdCost(S.cd);if(!S.rd&&S.cash>=c){S.cash-=c;const mo=rdMonths(S.cd);S.rd={...S.cd,left:mo,total:mo};say('Начата разработка «'+S.cd.name+'».')}}
  else if(a==='cp'){const[id,d]=v.split(':');const c=S.cons.find(x=>x.id===+id);if(c)c.price=Math.max(50,c.price+ +d)}
  else if(a==='genre')S.gd.genre=+v;
  else if(a==='scope')S.gd.scope=+v;
  else if(a==='gmk')S.gd.mk=+v;
  else if(a==='gcon')S.gd.con=+v;
  else if(a==='gname')S.gd.name=newGName();
  else if(a==='mkgame')makeGame();
  else if(a==='hire'){if(S.devs<12&&S.cash>=8000){S.cash-=8000;S.devs++;say('Нанят разработчик. В команде: '+S.devs+'.')}}
  else if(a==='res'){const[k,i]=v.split(':');if(i==='t'){const t=TECH.find(x=>x.k===k);if(t&&!S.res[k]&&S.br>=t.c){S.br-=t.c;S.res[k]=1;say('Изучено: '+t.n+'.')}}else{const it=itm(k,+i),c=bcost(+i);if(it.y<=yr()&&!isRes(k,+i)&&S.br>=c){S.br-=c;S.res[k+i]=1;say('Изучено: '+it.n+'.')}}}
  else if(a==='off'){const c=S.cons.find(x=>x.id===+v);if(c){c.off=true;say('Консоль «'+c.name+'» снята с продажи.')}}
  else if(a==='on'){const c=S.cons.find(x=>x.id===+v);if(c&&S.cash>=5000){S.cash-=5000;c.off=false;c.low=0;c.peak=0;say('Консоль «'+c.name+'» возвращена в продажу.')}}
  else if(a==='cer'){if(S.cer.step<2)S.cer.step++;else S.cer=null}
  else if(a==='io')menu='io';
  else if(a==='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#sv').value.trim()))));if(o&&o.cd&&o.gd){localStorage.setItem(KEY,JSON.stringify(o));setSpeed(0);S=load();S.speed=0;menu=false}}catch(e){}}
  else if(a==='ch'&&S.diff===3)runCheat(v);
  else if(a==='dev'&&S.diff===3)S.dev=!S.dev;
  else if(a==='cheat'&&S.diff===3){const el=$('#cheat'),c=el?el.value.trim().toLowerCase():'';if(el){el.value='';el.blur()}
    runCheat(c)}
  else if(a==='camp'){if(S.cash>=15000&&!(S.camp[v]>0)){S.cash-=15000;S.camp[v]=4;say('Рекламная кампания запущена: спрос +30% на 4 мес.')}}
  else if(a==='loan'){if(S.loan<200000){S.loan+=50000;S.cash+=50000;say('Взят кредит 50 000 $.')}}
  else if(a==='repay'){if(S.loan>0&&S.cash>=50000){S.loan-=50000;S.cash-=50000;say('Погашено 50 000 $ кредита.')}}
  else if(a==='up'){const u=UPS.find(x=>x.k===v),c=u.b*(S.up[v]+1);if(S.up[v]<5&&S.cash>=c){S.cash-=c;S.up[v]++;say('Улучшение: '+u.n+' до уровня '+S.up[v]+'.')}}
  else if(a==='fire'){if(S.devs>1&&S.proj.length+S.cprj.length<Math.ceil((S.devs-1)/2)){S.devs--;say('Разработчик уволен. В команде: '+S.devs+'.')}}
  else if(a==='cont')menu=false;
  else if(a==='menu'){setSpeed(0);menu=true;cn=false}
  else if(a==='newg'){if(hasSave()&&!cn){cn=true;render();return}cn=false;menu='diff'}
  else if(a==='start'){cn=false;setSpeed(0);S=fresh(+v);save();menu=false}
  else if(a==='back')menu=true;
  else if(a==='acc'){const i=S.offers.findIndex(o=>o.id===+v),o=S.offers[i];if(o&&S.cash>=o.cost){S.cash-=o.cost;S.offers.splice(i,1);S.cprj.push({...o,left:o.mo,total:o.mo});say('Подписан эксклюзивный контракт на «'+o.name+'».')}}
  else if(a==='dec')S.offers=S.offers.filter(o=>o.id!==+v);
  else if(a==='reset'){setSpeed(0);menu='diff'}
  save(); render();
}
function baseQ(g,c){
  const sc=SCOPES[g.scope], w=GENRES[g.genre].w, t=[c.cpu+1,c.gpu+1,c.ram+1,c.ctl+1];
  const fit=w.reduce((s,x,i)=>s+x*t[i],0)/w.reduce((a,b)=>a+b,0)*4;
  return 35+(S.res.t1?3:0)+S.up.qa*2+S.devs*3+sc.b+fit+c.media*sc.mm;
}
const clampQ=x=>Math.min(98,Math.max(20,Math.round(x)));
function gameCost(g){return SCOPES[g.scope].cost+MK[g.mk].cost}
function makeGame(){
  const g=S.gd, cid=g.con??(S.cons[0]&&S.cons[0].id), c=S.cons.find(x=>x.id===cid);
  if(!c||c.off||S.cash<gameCost(g)||S.proj.length>=Math.ceil(S.devs/2))return;
  const sc=SCOPES[g.scope], mo=Math.max(1,sc.mo-Math.floor((S.devs-1)/3));
  S.cash-=gameCost(g);
  S.proj.push({name:g.name,genre:g.genre,con:c.id,q:clampQ(baseQ(g,c)+rnd(-8,10)),mk:MK[g.mk].m,left:mo,total:mo});
  say('Начата работа над «'+g.name+'».'); g.name=newGName();
}

function partsRows(d){
  const y=yr();
  return CAT.map(c=>{
    const last=c.items.reduce((a,it,i)=>it.y<=y?i:a,0);
    const rows=c.items.map((it,i)=>{
      if(i>last+1)return '';
      const lock=it.y>y||!isRes(c.k,i);
      return `<button class="opt ${d[c.k]===i?'on':''}" data-a="part" data-v="${c.k}:${i}" ${lock?'disabled':''}><span class="o1">${it.n}</span><span class="o2">${lock?(it.y>y?'с '+it.y+' г.':'🧠 изучить'):fmt(it.uc)+' $ · R&amp;D '+fmt(it.rd)}</span></button>`;
    }).join('');
    return `<div class="card"><div class="lab">${c.n}</div>${rows}</div>`;
  }).join('');
}

  $('#nav').innerHTML=[['c','🎮 Консоли'],['g','🕹 Игры'],['r','🧠 Наука'],['s','🏢 Студия']].map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
  $('#ov').innerHTML=menu?MENU():S.cer?CER():S.over?`<div class="over"><div><h1>Банкротство</h1><p class="mute">Студия закрыта в ${label(S.m)}. Продано консолей: ${fmt(S.cons.reduce((a,c)=>a+c.sold,0))}.</p><button class="btn go" data-a="reset">Начать заново</button></div></div>`
    :S.won&&!S.wonSeen?`<div class="over"><div><h1>Вы победили</h1><p class="mute">Накоплено ${money(S.cash)} к ${label(S.m)}. Можно играть дальше.</p><button class="btn go" data-a="seen">Продолжить</button></div></div>`:'';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  if(b.dataset.a==='seen'){S.wonSeen=true;save();render();return}
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter')act('cheat');return}if(menu||e.code!=='Space')return;e.preventDefault();act('speed',S.speed?0:1)});
S=load(); S.speed=0; render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
